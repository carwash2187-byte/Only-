name: AquaFunded trading desk cycle

# Same free/zero-signup/Claude-independent pattern as trading-cycle.yml
# (the paper account), for the AquaFunded funded account. See that file's
# comments for why a copy of this must also live on the repo's default
# branch (claude/smillin-repo-install-3jsep0) for `schedule:` to fire at
# all -- checkout/push are pinned to the real trading branch regardless.
#
# SAFETY: this workflow deliberately never sets TRADELOCKER_LIVE. It can
# only ever run against TradeLocker's DEMO environment as written -- going
# live requires a separate, explicit code change, not a secret flip.
#
# Required GitHub repository secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret) -- add these once, nothing else needed:
#   AQUAFUNDED_TL_EMAIL
#   AQUAFUNDED_TL_PASSWORD
#   AQUAFUNDED_TL_SERVER      (value: AQUA)
#
# Runs are queued in their OWN concurrency group, separate from the paper
# account's -- different broker, different state directory
# (funded_state_aquafunded/), no shared-file race with paper_state/.
on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch: {}

concurrency:
  group: aquafunded-trading-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ai-trading-bot-research-yolqhm
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/deploy/requirements-bots.txt

      - name: Install lean bot dependencies (+ tradelocker)
        run: |
          pip install -r scripts/deploy/requirements-bots.txt
          pip install tradelocker

      - name: Run one desk cycle
        env:
          BOT_DATA_DIR: funded_state_aquafunded
          PYTHONPATH: .
          TRADELOCKER_EMAIL: ${{ secrets.AQUAFUNDED_TL_EMAIL }}
          TRADELOCKER_PASSWORD: ${{ secrets.AQUAFUNDED_TL_PASSWORD }}
          TRADELOCKER_SERVER: ${{ secrets.AQUAFUNDED_TL_SERVER }}
        run: python scripts/run_one_cycle_aquafunded.py

      - name: Commit and push any state changes
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add funded_state_aquafunded/
          if git diff --cached --quiet; then
            echo "no state changes this cycle"
          else
            git commit -m "AquaFunded cycle $(date -u +%FT%TZ)"
            git push origin HEAD:claude/ai-trading-bot-research-yolqhm
          fi
