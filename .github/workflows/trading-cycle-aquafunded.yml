name: AquaFunded trading desk cycle

# Same free/zero-signup/Claude-independent pattern as trading-cycle.yml
# (the paper account), for the AquaFunded funded account. A copy of this
# must also live on the repo's default branch for schedule: to register;
# checkout/push are pinned to the real trading branch regardless.
#
# TWO-KEY SAFETY MODEL (session 48, built at the user's explicit request):
#   Key 1 -- the three credential secrets below. With ONLY these set, the
#   bot trades TradeLocker's DEMO environment: real account, fake fills.
#   Key 2 -- the AQUAFUNDED_GO_LIVE secret. Real money moves ONLY when
#   this secret exists AND its value is exactly:
#       LIVE-I-UNDERSTAND-THE-RISK
#   Adding that secret is the account owner's own deliberate act -- that
#   IS the go-live consent. Any other value (or absence) stays demo.
#   To stand down from live at any time: delete the secret.
#
# Required GitHub repository secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret):
#   AQUAFUNDED_TL_EMAIL      (must be a valid email -- a malformed value
#                             here fails auth with "email must be an email")
#   AQUAFUNDED_TL_PASSWORD
#   AQUAFUNDED_TL_SERVER      (value: AQUA)
#   AQUAFUNDED_GO_LIVE        (OPTIONAL -- Key 2, see above. Do not add
#                              until the risk-sweep evidence supports it.)
#
# SELF-CHAINING + RUNAWAY-LOOP FIX (session 48): schedule cron proved
# unreliable, so the last step re-dispatches this workflow on success.
# if: success() (not always()) so an instant startup failure (bad secret,
# broker down) can't spin a fast re-trigger loop -- it falls back to the
# 5-minute cron. (A real incident: a malformed email secret produced ~30
# failed runs in 2 minutes under the old if: always().)
#
# Own concurrency group, separate state dir (funded_state_aquafunded/) --
# no shared-file race with paper_state/.
on:
  schedule:
    - cron: "*/5 * * * *"  # backup restart / retry path only
  workflow_dispatch: {}  # also seeds the chain

concurrency:
  group: aquafunded-trading-cycle
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ai-trading-bot-research-yolqhm
          fetch-depth: 0  # full history so the push-retry rebase below always has a common ancestor

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/deploy/requirements-bots.txt

      - name: Install lean bot dependencies (+ tradelocker)
        run: |
          pip install -r scripts/deploy/requirements-bots.txt
          pip install tradelocker

      - name: Run one desk cycle
        env:
          BOT_DATA_DIR: funded_state_aquafunded
          PYTHONPATH: .
          TRADELOCKER_EMAIL: ${{ secrets.AQUAFUNDED_TL_EMAIL }}
          TRADELOCKER_PASSWORD: ${{ secrets.AQUAFUNDED_TL_PASSWORD }}
          TRADELOCKER_SERVER: ${{ secrets.AQUAFUNDED_TL_SERVER }}
          AQUAFUNDED_GO_LIVE: ${{ secrets.AQUAFUNDED_GO_LIVE }}
        run: |
          # Key 2 gate: TRADELOCKER_LIVE is derived here, in plain sight,
          # never stored -- only the exact consent phrase unlocks live.
          if [ "$AQUAFUNDED_GO_LIVE" = "LIVE-I-UNDERSTAND-THE-RISK" ]; then
            echo "Key 2 present: running against LIVE TradeLocker (real money)"
            export TRADELOCKER_LIVE=1
          else
            echo "Key 2 absent: demo environment (no real money)"
          fi
          python scripts/run_one_cycle_aquafunded.py

      - name: Commit and push any state changes
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add funded_state_aquafunded/
          if git diff --cached --quiet; then
            echo "no state changes this cycle"
            exit 0
          fi
          git commit -m "AquaFunded cycle $(date -u +%FT%TZ)"
          # Concurrent writers (the paper workflow, my code commits) move the
          # branch tip while this job runs, so a plain push gets rejected
          # (non-fast-forward). Rebase our state-only commit onto the latest
          # tip and retry -- the bot only ever touches funded_state_aquafunded/,
          # which no other writer touches, so the rebase is always clean.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:claude/ai-trading-bot-research-yolqhm; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected (attempt $attempt) -- rebasing on latest tip, retrying"
            git fetch origin claude/ai-trading-bot-research-yolqhm
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          echo "push still failing after 5 attempts"; exit 1

      - name: Chain-trigger the next cycle
        if: success()
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/trading-cycle-aquafunded.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
