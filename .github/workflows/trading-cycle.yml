name: Trading desk cycle

# IMPORTANT: GitHub only evaluates `schedule:` triggers on the repo's
# DEFAULT branch's copy of this file. This repo's default branch is an
# unrelated stale import branch (claude/smillin-repo-install-3jsep0), not
# the live trading branch -- so an identical copy of this file also lives
# there, purely so the cron fires at all. That copy's checkout/push steps
# are pinned to claude/ai-trading-bot-research-yolqhm (see `ref:` below and
# the push command), so the actual account/code touched is always the real
# live branch regardless of which branch's copy of the YAML triggered the
# run. Keep both copies identical; this file is the source of truth.
#
# Free, zero-signup replacement for a persistent Claude-session process:
# GitHub's own scheduler runs this repo's bots/ code every minute,
# matching MambaFX's actual documented cadence, forever, on GitHub's
# infrastructure -- no VPS, no server, no account to create, no Claude
# usage. Session 48: this repo is now PUBLIC specifically to unlock
# unlimited free Actions minutes (a private repo's 2,000 min/month budget
# could not support this cadence -- confirmed by real timing on the first
# live run, see git history for the 30-min interval that was used until
# the repo went public).
#
# SCHEDULING FIX (session 48, second attempt): the 1-minute cron
# (`* * * * *`) NEVER FIRED -- zero scheduled runs in 80+ minutes,
# verified via the Actions run list, only manual dispatches ran. Root
# cause: GitHub's own documentation states "The shortest interval you
# can run scheduled workflows is once every 5 minutes" -- a sub-minimum
# cron isn't clamped to 5 minutes, it's simply never scheduled. So the
# honest fastest free cadence is */5, not * -- set accordingly. GitHub
# additionally warns scheduled runs can be delayed or dropped under
# load, so treat 5 minutes as a target, not a guarantee.
#
# Runs are queued, never parallel (concurrency group below), so this is
# the ONLY process that may run desk.run_once() against paper_state/ --
# do not also run `python -m bots autopilot` anywhere else at the same
# time, or the same account gets double-traded.
#
# SELF-CHAINING FIX (session 48, third attempt): even the */5 cron never
# fired -- ZERO scheduled runs in 5+ hours after the fix above, verified
# via the Actions run list (only workflow_dispatch events ever appeared).
# GitHub's own docs admit scheduled runs "can be delayed or dropped under
# load," but 5 hours of complete silence on a plain */5 cron is beyond
# any documented delay -- treat GitHub's scheduler as unreliable for this
# repo, not just slow. Fix: stop depending on it as the primary driver.
# The last step below re-dispatches THIS SAME workflow via the Actions
# API the moment a cycle finishes, so each run chains directly into the
# next one -- true continuous operation that doesn't wait on GitHub's
# cron timing at all. `schedule:` stays as a backup restart ONLY, in case
# the chain ever breaks (e.g. a runner-level failure before the last
# step) -- it is no longer the thing this depends on.
on:
  schedule:
    - cron: "*/5 * * * *"  # backup restart only -- see SELF-CHAINING FIX above
  workflow_dispatch: {}  # manual "Run workflow" button, also used to seed the chain

concurrency:
  group: paper-trading-cycle
  cancel-in-progress: false  # queue, never kill a cycle mid-trade

permissions:
  contents: write
  actions: write  # needed to re-dispatch this workflow from within itself

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ai-trading-bot-research-yolqhm
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/deploy/requirements-bots.txt

      - name: Install lean bot dependencies
        run: pip install -r scripts/deploy/requirements-bots.txt

      - name: Run one desk cycle
        env:
          BOT_DATA_DIR: paper_state
          PYTHONPATH: .
        run: python scripts/run_one_cycle.py

      - name: Commit and push any state changes
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper_state/
          if git diff --cached --quiet; then
            echo "no state changes this cycle"
          else
            git commit -m "Autopilot cycle $(date -u +%FT%TZ)"
            git push origin HEAD:claude/ai-trading-bot-research-yolqhm
          fi

      - name: Chain-trigger the next cycle
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/trading-cycle.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
