name: Trading desk cycle

# IMPORTANT: GitHub only evaluates `schedule:` triggers on the repo's
# DEFAULT branch's copy of this file. This repo's default branch is an
# unrelated stale import branch (claude/smillin-repo-install-3jsep0), not
# the live trading branch -- so an identical copy of this file also lives
# there, purely so the cron fires at all. That copy's checkout/push steps
# are pinned to claude/ai-trading-bot-research-yolqhm (see `ref:` below and
# the push command), so the actual account/code touched is always the real
# live branch regardless of which branch's copy of the YAML triggered the
# run. Keep both copies identical; this file is the source of truth.
#
# Free, zero-signup replacement for a persistent Claude-session process:
# GitHub's own scheduler runs this repo's bots/ code, matching MambaFX's
# always-on style, on GitHub's infrastructure -- no VPS, no Claude usage.
#
# SELF-CHAINING (session 48): GitHub's schedule cron proved unreliable
# (zero scheduled runs in 5+ hours), so the last step re-dispatches this
# same workflow via the Actions API on success, chaining runs continuously.
# schedule: is a backup restart only. if: success() (not always()) so an
# instant startup failure can't spin a fast re-trigger loop -- it falls
# back to the 5-minute cron instead.
on:
  schedule:
    - cron: "*/5 * * * *"  # backup restart / retry path only
  workflow_dispatch: {}  # manual button, also seeds the chain

concurrency:
  group: paper-trading-cycle
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ai-trading-bot-research-yolqhm
          fetch-depth: 0  # full history so the push-retry rebase below always has a common ancestor

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/deploy/requirements-bots.txt

      - name: Install lean bot dependencies
        run: pip install -r scripts/deploy/requirements-bots.txt

      - name: Run one desk cycle
        env:
          BOT_DATA_DIR: paper_state
          PYTHONPATH: .
        run: python scripts/run_one_cycle.py

      - name: Commit and push any state changes
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper_state/
          if git diff --cached --quiet; then
            echo "no state changes this cycle"
            exit 0
          fi
          git commit -m "Autopilot cycle $(date -u +%FT%TZ)"
          # Concurrent writers (the AquaFunded workflow, my code commits) move
          # the branch tip while this job runs, so a plain push gets rejected
          # (non-fast-forward). Rebase our state-only commit onto the latest
          # tip and retry -- the bot only ever touches paper_state/, which no
          # other writer touches, so the rebase is always clean.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:claude/ai-trading-bot-research-yolqhm; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected (attempt $attempt) -- rebasing on latest tip, retrying"
            git fetch origin claude/ai-trading-bot-research-yolqhm
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          echo "push still failing after 5 attempts"; exit 1

      - name: Chain-trigger the next cycle
        if: success()
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/trading-cycle.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
