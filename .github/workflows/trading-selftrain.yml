name: Trading desk nightly self-train

# Free replacement for scripts/watchdog.sh's nightly retrain step: once a
# day, practice the live Q-table on the real roughest and strongest-trend
# recent market windows, then commit the updated qtable.json. Runs on
# GitHub's infrastructure, no Claude usage, no server.
#
# Session 48: practice_on_rough_windows()'s defaults were raised
# substantially (3->15 windows each of rough/trend days, 20->60 episodes)
# per user request for real volume -- this typically produces several
# thousand REAL measured closed practice trades in one run (the actual
# total is printed at the end, not estimated), covering both bad and
# good historical stretches. That means real wall-clock time: expect
# tens of minutes, not seconds, hence the wider timeout below.
# CONCURRENCY BUG FOUND AND FIXED (session 48): this used to share the
# `paper-trading-cycle` group with trading-cycle.yml, on the reasoning
# "never run a cycle and a retrain at the same time." That made sense when
# the cycle workflow ran once per 5-minute trigger -- but since the
# self-chaining fix, trading-cycle.yml now runs continuously, back-to-back,
# forever, with zero idle gaps. A job sharing its concurrency group can
# never get a turn: this workflow's one scheduled firing queued behind the
# cycle chain and was cancelled without ever running -- self-training was
# silently dead the whole time. Given its own group now. The remaining
# risk (both workflows can write paper_state/qtable.json at overlapping
# times) is handled the same way as the cycle/aquafunded race: rebase +
# retry on push rejection, not mutual exclusion.
#
# SESSION 50: added a second job that runs the exact same practice
# (episodes raised 60->90 this session too, "more time in the
# simulation") against the REAL AquaFunded account's own Q-table
# (funded_state_aquafunded/), not just the paper account's. Before this,
# only the paper model got nightly practice -- the account actually
# trading real money never did. Runs as its own job (parallel with
# self-train, its own concurrency group, its own state dir) so it can't
# block or be blocked by the paper run, and never touches a broker (Q-
# table training is pure historical-data replay, no TradeLocker needed).
#
# SESSION 52: added a second practice pass on the synthetic 13-regime
# scenario harness (bots/learning/scenarios.py), 2000 sessions/night.
# This module existed since session "13" (see task history) but was
# never wired into anything automated -- pure dead code, despite being
# exactly the fast-forward simulator later requested ("run a month of
# trading in a night"). It manufactures regimes real ~60-day intraday
# history barely shows (flash crashes, news-spike whipsaws, blow-off
# tops) and drills the agent on them in ~5 min/2000 sessions (measured
# locally). Deliberately kept SEPARATE from the real-window practice
# above, not a replacement for it: synthetic price paths are
# data-augmentation for regime *types*, not a real track record --
# a 20-scenario local test run this session actually scored 27% win
# rate, proof this can't be spun as a shortcut to a specific number.
# --save hardens the live Q-table in place; never touches the journal
# or paper/funded account.
on:
  schedule:
    - cron: "0 7 * * *"  # ~3am ET / 7am UTC, after the NY session closes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  self-train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: paper-selftrain  # own group -- see the bug writeup above
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ai-trading-bot-research-yolqhm
          fetch-depth: 0  # full history so the push-retry rebase below always has a common ancestor

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/deploy/requirements-bots.txt

      - name: Install lean bot dependencies
        run: pip install -r scripts/deploy/requirements-bots.txt

      - name: Practice on real rough/trending windows
        env:
          BOT_DATA_DIR: paper_state
          PYTHONPATH: .
        run: python scripts/stress_test.py --practice

      - name: Practice on synthetic regime scenarios (fast-forward simulator)
        env:
          BOT_DATA_DIR: paper_state
          PYTHONPATH: .
        run: python -m bots practice --scenarios 2000 --save

      - name: Commit and push the updated Q-table
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper_state/
          if git diff --cached --quiet; then
            echo "no state changes from this training run"
            exit 0
          fi
          git commit -m "Nightly self-train $(date -u +%FT%TZ)"
          # The live cycle chain (trading-cycle.yml) writes paper_state/
          # continuously and can move the branch tip while this long-running
          # training job is still going. Rebase our commit onto the latest
          # tip and retry, same pattern proven on the cycle workflows.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:claude/ai-trading-bot-research-yolqhm; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected (attempt $attempt) -- rebasing on latest tip, retrying"
            git fetch origin claude/ai-trading-bot-research-yolqhm
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          echo "push still failing after 5 attempts"; exit 1

  self-train-aquafunded:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: aquafunded-selftrain  # own group, parallel with self-train above
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ai-trading-bot-research-yolqhm
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/deploy/requirements-bots.txt

      - name: Install lean bot dependencies
        run: pip install -r scripts/deploy/requirements-bots.txt

      - name: Practice on real rough/trending windows (AquaFunded's own Q-table)
        env:
          BOT_DATA_DIR: funded_state_aquafunded
          PYTHONPATH: .
        run: python scripts/stress_test.py --practice

      - name: Practice on synthetic regime scenarios (fast-forward simulator)
        env:
          BOT_DATA_DIR: funded_state_aquafunded
          PYTHONPATH: .
        run: python -m bots practice --scenarios 2000 --save

      - name: Commit and push the updated Q-table
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add funded_state_aquafunded/
          if git diff --cached --quiet; then
            echo "no state changes from this training run"
            exit 0
          fi
          git commit -m "Nightly self-train (AquaFunded) $(date -u +%FT%TZ)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:claude/ai-trading-bot-research-yolqhm; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected (attempt $attempt) -- rebasing on latest tip, retrying"
            git fetch origin claude/ai-trading-bot-research-yolqhm
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          echo "push still failing after 5 attempts"; exit 1
